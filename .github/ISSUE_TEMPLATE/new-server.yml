name: New server request
description: Ask for an image for a game that isn't in Servers/ yet
labels: ["new server", "triage"]
body:
  - type: input
    id: game
    attributes:
      label: Game
      placeholder: Unreal Tournament 2004
    validations:
      required: true

  - type: textarea
    id: server-files
    attributes:
      label: Where the dedicated server comes from
      description: SteamCMD app id (anonymous or needs a login?), a download link, or retail files only. Linux or Windows-only?
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Anything else
      description: Ports, mods or community patches clients need, known LAN quirks, links (Steam, IGDB, PCGamingWiki).
