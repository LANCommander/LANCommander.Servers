user www-data;
worker_processes 2;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

# Takes the place of the Apache server MHServerEmu ships for Windows: serves the web files
# (SiteConfig.xml, store, news, loading tips) and passes the web front end's paths on to
# MHServerEmu, over HTTP on 80 and HTTPS on 443. The client logs in over HTTPS (SiteConfig.xml's
# AuthServerPort 443) and doesn't check the certificate.
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     {{TLS_CERT}};
        ssl_certificate_key {{TLS_KEY}};
        # The 2017 client; same as the shipped Apache config (all but SSLv3, HIGH:MEDIUM)
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:MEDIUM:!MD5:!RC4:!3DES:@SECLEVEL=0;
        ssl_prefer_server_ciphers on;

        root {{WEB_ROOT}};
        index index.html;

        location ~ ^/(AuthServer|MTXStore|AccountManagement|ServerStatus|RegionReport|Metrics|Dashboard)(/|$) {
            proxy_pass http://127.0.0.1:{{WEB_PORT}};
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:{{WEB_PORT}};
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 16m;
        }

        # Apache on Windows matched these case-insensitively
        location = /liveloadingtips.xml { try_files /LiveLoadingTips.xml =404; }
        location = /siteconfig.xml      { try_files /SiteConfig.xml =404; }

        location ~ /\. {
            deny all;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
